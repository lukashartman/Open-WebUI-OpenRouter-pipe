[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-webui-openrouter-pipe"
version = "2.7.3"
description = "OpenRouter Responses API pipe for Open WebUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "rbb-dev"}
]
maintainers = [
  {name = "rbb-dev"}
]
dependencies = [
  "aiohttp",
  "cairosvg",
  "cryptography",
  "fastapi",
  "httpx",
  "imageio",
  "imageio-ffmpeg",
  "lz4",
  "Pillow",
  "pydantic",
  "pydantic-core",
  "pyzipper",
  "sqlalchemy",
  "tenacity"
]

[project.optional-dependencies]
dev = [
  # aioresponses 0.7.9 cannot construct aiohttp 3.14 responses
  # (ClientResponse gained a required stream_writer kwarg), so every
  # HTTP-mocking test fails or hangs. Cap aiohttp until aioresponses
  # supports 3.14.
  "aiohttp>=3.9,<3.14",
  "aioresponses"
]

[project.urls]
Homepage = "https://github.com/rbb-dev"
Repository = "https://github.com/rbb-dev/Open-WebUI-OpenRouter-pipe"
Documentation = "https://github.com/rbb-dev/Open-WebUI-OpenRouter-pipe/blob/main/docs/README.md"
"Bug Tracker" = "https://github.com/rbb-dev/Open-WebUI-OpenRouter-pipe/issues"

[tool.setuptools.packages.find]
include = ["open_webui_openrouter_pipe*"]

[tool.setuptools.package-data]
open_webui_openrouter_pipe = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["pytest_bootstrap.py"]

[tool.ruff.lint]
# Pin the rule selection explicitly. CI installs ruff unpinned, and ruff's
# built-in default rule set broadened over time, which silently turned the
# lint job red on pre-existing code. Selecting the long-standing default
# (E4/E7/E9/F) keeps lint results deterministic across ruff versions.
select = ["E4", "E7", "E9", "F"]
